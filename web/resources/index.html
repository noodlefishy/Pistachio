<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pistachio Visual Debugger</title>
    <style>
        body { font-family: monospace; margin: 15px; display: flex; flex-direction: column; height: 95vh; }
        .toolbar { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        .dashboard { display: flex; gap: 15px; flex: 1; overflow: hidden; }

        button, input { font-family: monospace; cursor: pointer; }

        .panel { border: 1px solid black; padding: 10px; overflow-y: auto; }
        .panel-center { display: flex; flex-direction: column; align-items: center; }

        #screen { border: 1px solid black; image-rendering: pixelated; width: 384px; height: 384px; background: black; }

        .code-row { display: flex; gap: 10px; padding: 2px; }
        .active-pc { background: yellow; font-weight: bold; }
        .breakpoint { background: pink; }
        .active-pc.breakpoint { background: orange; }

        /* Width adjusted to fit longer labels */
        .addr { width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hex { width: 50px; }
        .inst { flex: 1; white-space: pre; }

        /* Registers Grid */
        .reg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .reg-box { border: 1px solid gray; padding: 5px; }
        .reg-name { display: inline-block; width: 30px; font-weight: bold; }
    </style>
</head>
<body>

<h3>Pistachio Visual Debugger</h3>

<div class="toolbar">
    <b>Load Files:</b>
    <!-- Added "multiple" so you can select the .bin and .map files at the same time -->
    <input type="file" id="binPicker" accept=".bin,.map" multiple title="Select both .bin and .map files for labels!">
    <button id="btnStep" disabled>Step (S)</button>
    <button id="btnRun" disabled>Run / Pause (P)</button>
    <span id="status">Awaiting binary...</span>
</div>

<div class="dashboard">
    <!-- Center: Screen & PC -->
    <div class="panel panel-center">
        <b>Display</b><br>
        <canvas id="screen" width="64" height="64" tabindex="1"></canvas>
        <div style="margin-top: 15px; text-align: left; width: 100%;">
            <b>Status:</b> <span id="cpuStatus">HALTED</span><br>
            <b>PC:</b> <span id="regPC">0x0000</span><br>
            <b>EPC:</b> <span id="regEPC">0x0000</span>
        </div>
    </div>

    <!-- Right: Code Disassembly -->
    <div class="panel" style="flex: 2; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <b>Live Disassembly</b>
            <div>
                <button id="btnScrollUp">▲ Up</button>
                <button id="btnScrollDown">▼ Down</button>
                <button id="btnSnapPC">Snap to PC</button>
            </div>
        </div>
        <br>
        <div id="codeView" style="flex: 1; overflow-y: auto;"></div>

        <!-- Command Bar (lx-dbg) -->
        <div style="margin-top: 10px; display: flex; gap: 5px;">
            <span style="padding-top: 3px;"><b>(lx-dbg)&gt;</b></span>
            <input type="text" id="cmdInput" placeholder="until 0x3050, break main, xvon 0x3000..." style="flex: 1;">
            <button id="btnCmd">Exec</button>
        </div>
    </div>

    <div class="panel" style="flex: 1;">
        <b>Registers</b><br><br>
        <div class="reg-grid" id="registersView"></div>

        <br><b>Stack (R6)</b><br><br>
        <div id="stackView" style="border: 1px solid gray; padding: 10px;"></div>
    </div>
</div>

{{kotlin.scripts}}
</body>
</html>
